<!DOCTYPE html>
<html>
  <head>
    <title>Delegate Registration</title>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }
      input, select, button { margin: 8px; padding: 10px; width: 320px; box-sizing: border-box; }
      button { background: #fbbc05; color: white; border: none; border-radius: 5px; cursor: pointer; }
      button:hover { background: #e2aa04; }
      .result { margin-top: 20px; font-weight: bold; }
    </style>
    <script>
      function registerUser() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerText = "Registering...";
        resultDiv.style.color = "orange";

        const delegateData = {
          pin: document.getElementById("pin").value,
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          gender: document.getElementById("gender").value,
          address: document.getElementById("address").value,
          zone: document.getElementById("zone").value,
          branch: document.getElementById("branch").value,
          status: document.getElementById("status").value,
          email: document.getElementById("email").value
        };

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              resultDiv.innerText = response.message;
              resultDiv.style.color = "green";
              // Clear form fields after successful registration
              document.getElementById("registrationForm").reset();
            } else {
              resultDiv.innerText = "Error: " + response.message;
              resultDiv.style.color = "red";
            }
          })
          .withFailureHandler(function(error) {
            resultDiv.innerText = "An unexpected error occurred: " + error.message;
            resultDiv.style.color = "red";
          })
          .registerDelegate(delegateData);
      }
    </script>
  </head>
  <body>
    <h2>Delegate Registration</h2>
    <form id="registrationForm">
      <input type="text" id="pin" placeholder="Enter PIN (e.g., SUDYW-xxxxxxxx)" required><br>
      <input type="text" id="name" placeholder="Enter Full Name" required><br>
      <input type="tel" id="phone" placeholder="Enter Phone Number (e.g., 080...)" required><br>
      <select id="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select><br>
      <input type="text" id="address" placeholder="Enter Full Address" required><br>
      <input type="text" id="zone" placeholder="Enter Zone" required><br>
      <input type="text" id="branch" placeholder="Enter Branch" required><br>
      <select id="status" required>
        <option value="" disabled selected>Select Status</option>
        <option value="Student">Student</option>
        <option value="Worker">Worker</option>
        <option value="Other">Other</option>
      </select><br>
      <input type="email" id="email" placeholder="Enter Email (Optional)"><br>
    </form>
    <button onclick="registerUser()">Register</button>
    <div id="result" class="result"></div>
  </body>
</html>
