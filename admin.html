<!DOCTYPE html>
<html>
  <head>
    <title>Admin - Generate PIN</title>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
      input, button { margin: 10px; padding: 10px; width: 250px; }
      button { background: #34a853; color: white; border: none; border-radius: 5px; }
      button:hover { background: #2c8c47; cursor: pointer; }
      .result { margin-top: 20px; font-weight: bold; color: green; }
    </style>
    <script>
      function generatePIN() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerText = "Generating...";
        resultDiv.style.color = "orange";

        const adminKey = document.getElementById("adminKey").value;
        const phone = document.getElementById("phone").value;

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              resultDiv.innerText = "Generated PIN: " + response.pin;
              resultDiv.style.color = "green";
            } else {
              resultDiv.innerText = "Error: " + response.message;
              resultDiv.style.color = "red";
            }
          })
          .withFailureHandler(function(error) {
            resultDiv.innerText = "An unexpected error occurred: " + error.message;
            resultDiv.style.color = "red";
          })
          .generatePin(phone, adminKey); // Corrected function name and argument order
      }
    </script>
  </head>
  <body>
    <h2>Admin Panel</h2>
    <input type="password" id="adminKey" placeholder="Enter Admin Key"><br>
    <input type="text" id="phone" placeholder="Enter Delegate Phone Number"><br>
    <button onclick="generatePIN()">Generate PIN</button>
    <div id="result" class="result"></div>
  </body>
</html>
