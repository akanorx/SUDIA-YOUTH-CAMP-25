<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegate Registration - SUDAI Youth Wing Camp 2025</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h2>Delegate Registration</h2>
        <form id="registrationForm">
            <label for="pin">Registration PIN:</label>
            <input type="text" id="pin" placeholder="Enter PIN from admin" required>

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="e.g., 08012345678" required>

            <label for="gender">Gender:</label>
            <select id="gender" required>
                <option value="" disabled selected>-- Select Gender --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="address">Full Address:</label>
            <input type="text" id="address" placeholder="Enter your full address" required>

            <label for="zone">Zone:</label>
            <input type="text" id="zone" placeholder="Enter your zone" required>

            <label for="branch">Branch:</label>
            <input type="text" id="branch" placeholder="Enter your branch" required>

            <label for="status">Status:</label>
            <select id="status" required>
                <option value="" disabled selected>-- Select Status --</option>
                <option value="Student">Student</option>
                <option value="Worker">Worker</option>
                <option value="Other">Other</option>
            </select>

            <label for="email">Email Address (Optional):</label>
            <input type="email" id="email" placeholder="Enter your email address">
        </form>

        <button id="btn-register" onclick="registerDelegate()">Register</button>

        <div id="result" class="result" style="display: none;"></div>
        <div style="text-align:center; margin-top: 20px;">
            <a href="/index.html">Back to Home</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');

        async function registerDelegate() {
            // Check if form is valid (for modern browsers)
            if (!form.checkValidity()) {
                showResult('Please fill out all required fields correctly.', 'error');
                return;
            }

            const delegateData = {
                pin: document.getElementById('pin').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                gender: document.getElementById('gender').value,
                address: document.getElementById('address').value,
                zone: document.getElementById('zone').value,
                branch: document.getElementById('branch').value,
                status: document.getElementById('status').value,
                email: document.getElementById('email').value,
            };

            showResult('Submitting registration...', 'pending');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(delegateData),
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(data.message, 'success');
                    form.reset(); // Clear the form on success
                } else {
                    showResult(`Error: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('Failed to register:', error);
                showResult('An unexpected error occurred. Check the console.', 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
